<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4eee1">
    <title>数字予測マジック</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section id="mode-selection" class="screen mode-selection">
            <div class="top-row">
                <p class="kicker">KAZU-ATE MAGIC</p>
                <p class="stamp stamp--pink" aria-hidden="true">ぜったい<br>当たる</p>
            </div>

            <div class="hero">
                <h1 class="hero-title">
                    <span>数字</span>
                    <span>予測</span>
                    <span>マジック</span>
                </h1>
            </div>

            <p class="lead">
                好きな数をひとつ、こっそり決めてね。<br>
                カードに「ある」「ない」で答えるだけで、きみの数を当てちゃいます。
            </p>

            <div class="mode-pick">
                <p class="label">どっちで遊ぶ？</p>
                <div class="mode-buttons">
                    <button class="mode-btn mode-btn--pink" onclick="startGame(100)">
                        <span class="mode-range">1〜100</span>
                        <span class="mode-meta">カード 7まい</span>
                    </button>
                    <button class="mode-btn mode-btn--blue" onclick="startGame(1000)">
                        <span class="mode-range">1〜1000</span>
                        <span class="mode-meta">カード 10まい</span>
                    </button>
                </div>
            </div>
        </section>

        <section id="game-screen" class="screen game-screen hidden">
            <div class="top-row">
                <div>
                    <div class="kicker-row">
                        <p class="kicker" id="mode-label"></p>
                        <button class="restart-btn" onclick="restartGame()">↺ はじめから</button>
                    </div>
                    <p class="game-title">数字予測<br>マジック</p>
                    <p id="instruction" class="question"></p>
                </div>
                <p class="stamp stamp--blue" id="card-stamp" aria-live="polite">
                    <span>CARD</span>
                    <span id="card-no"></span>
                    <span class="stamp-total" id="card-total"></span>
                </p>
            </div>

            <div id="sheet" class="sheet">
                <div id="numbers-grid" class="numbers-grid"></div>
            </div>

            <div class="button-container">
                <button id="yes-btn" class="action-btn yes-btn" onclick="updateScreen(true)">
                    ある!<kbd>1</kbd>
                </button>
                <button id="no-btn" class="action-btn no-btn" onclick="updateScreen(false)">
                    ない…<kbd>0</kbd>
                </button>
            </div>
        </section>

        <section id="result-screen" class="screen result-screen hidden">
            <div class="result-content">
                <p class="pop" id="result-pop"></p>
                <p class="result-lead" id="result-lead"></p>
                <div class="burst">
                    <span class="result-number" id="result-number"></span>
                </div>
                <p class="result-tail" id="result-tail"></p>
                <button class="result-btn" onclick="restartGame()">もういっかい</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
